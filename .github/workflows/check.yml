name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brewery
          POSTGRES_PASSWORD: brewery
          POSTGRES_DB: brewery
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U brewery"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://brewery:brewery@localhost:5432/brewery?schema=public
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      APP_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
