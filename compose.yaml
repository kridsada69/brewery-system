services:
  db-dev:
    image: postgres:16
    profiles: [dev]
    env_file: .env.dev
    environment:
      POSTGRES_USER: brewery_dev
      POSTGRES_DB: brewery_dev
    ports: ["127.0.0.1:5433:5432"]
    volumes: [brewery_dev_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U brewery_dev -d brewery_dev"]
      interval: 2s
      timeout: 5s
      retries: 30
  db-prod:
    image: postgres:16
    profiles: [prod]
    env_file: .env.prod
    environment:
      POSTGRES_USER: brewery_prod
      POSTGRES_DB: brewery_prod
    ports: ["127.0.0.1:5434:5432"]
    volumes: [brewery_prod_data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U brewery_prod -d brewery_prod"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  brewery_dev_data:
  brewery_prod_data:
